<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus pedidos | FORJHA</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="forjha-signature.css"><link rel="stylesheet" href="forjha-suite.css"></head><body><nav class="navbar navbar-forjha"><div class="container"><a class="navbar-brand navbar-brand-logo" href="index.html">FOR<span>JHA</span></a><a href="index.html" class="ms-auto text-decoration-none text-white"><i class="bi bi-arrow-left me-2"></i>Loja</a></div></nav><main class="container py-5"><p class="section-sub">Minha conta</p><h1 class="section-title mb-4">Meus <span class="accent">pedidos</span></h1><div id="orderList"></div></main><script src="forjha-suite.js"></script><script>
let session=null;try{session=JSON.parse(localStorage.getItem('forjhaSession')||'null')}catch{}if(!session)location.href='login.html';
let orders=[];try{orders=JSON.parse(localStorage.getItem('forjhaOrders')||'[]')}catch{}
const list=document.getElementById('orderList');if(!orders.length){list.innerHTML='<div class="text-secondary p-4 border rounded-4">Você ainda não realizou pedidos neste navegador.</div>'}else{list.innerHTML=orders.map((o,i)=>`<article class="fj-order"><div class="d-flex justify-content-between"><strong>Pedido ${o.id||('#'+(1000+i))}</strong><span class="accent">${o.status||'Confirmado'}</span></div><p class="mt-2 mb-1">${o.items||'Itens do pedido'}</p><small class="text-secondary">${o.date||''} · ${o.total||''}</small><div class="fj-track"><span class="done"></span><span class="done"></span><span class="${o.status==='Em transporte'?'done':''}"></span><span></span></div></article>`).join('')}
</script></body></html>
